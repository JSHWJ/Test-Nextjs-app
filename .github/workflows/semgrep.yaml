name: Semgrep

on:
  push:
    branches: [ main ] #main 브랜치로 push 될 때 실행된다.
  pull_request:
    branches: [ main ] #main 브랜치 대상 pr이 생성되거나 변경될 때 실행된다. 
  workflow_dispatch: #수동 실행 트리거거

jobs:
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest

# Github Actions에서 
    steps:
      - name: Chechout code
        uses: actions/checkout@v4 #깃 저장소의 main 브랜치의 코드를 해당 우분투 서버 디렉토리에 내려받는다. 

      - name: Install Semgrep # -- 파일로 결과 뽑아서 Github 보안 탭에 업로드 하려면 install이 필요함 
        run: pip install semgrep

      - name: Run Semgrep and generate SARIF
        run: semgrep --config=p/default --sarif -o semgrep.sarif
        # --config=p/default : Semgrep에서 제공하는 기본 보안 규칙 셋을 사용한다.
        # --sarif : 결과를 SARIF 포맷으로 출력한다.
        # -o semgrep.sarif : 결과를 파일로 저장한다.

      - name: Upload SARIF to Github Security tab
        uses: github/codeql-action/upload-sarif@v3 # sarif 업로드 액션을 쓰겠다. 깃허브 시큐리티 탭에서 보안 경고 보기 위해 표준 sarif 포맷 요구하는데, 이 액션은 sarif를 받아서 보안 탭에 자동으로 업로드해주는 액션이다.
        with: 
          sarif_file: semgrep.sarif #semgrep.sarif 파일을 업로드 하겠다.

        #uses: 깃허브 액션에서 외부 액션을 불러와서 사용하겠다는 뜻임. 내가 직접 명령어 run 쓰는게 아니라 uses
        #with: uses로 불러온 액션에 설정값을 넘겨주는 역할을 한다.
        #Semgrep의 기본 출력은 stdout 표준 출력 형태이다. 콘솔 창에 텍스트 형태로 나온다.